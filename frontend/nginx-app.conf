# Shared server body: static SPA + API proxy.
#
# Included by both nginx.conf.template (HTTPS, production) and
# nginx.http.conf.template (plain HTTP, local Docker), so the two cannot drift
# apart. This file is copied verbatim, never run through envsubst, so nginx's
# own $host / $uri / $remote_addr variables here are always safe.

# Where the frontend files live
root /usr/share/nginx/html;
index index.html;

# Enable gzip compression for faster loading
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied expired no-cache no-store private auth;
gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

# Proxy API requests to the backend
location /api {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    # Allow large file uploads (photos/videos)
    client_max_body_size 200M;
}

# Serve uploaded files
location /uploads {
    proxy_pass http://backend:3001/uploads;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Cache uploaded files for 1 year (they don't change)
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# SPA (Single Page Application) routing
# If a file doesn't exist, serve index.html
# This allows React Router to handle the routing
location / {
    try_files $uri $uri/ /index.html;
}

# Cache static assets (JS, CSS, images)
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}
