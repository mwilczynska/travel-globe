<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="Travel Globe">
  <title>Travel Globe</title>
  <!-- Neutral placeholder logo. A deployment overrides this by dropping its
       own logo.png into frontend/public/branding/ (gitignored). -->
  <g fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round">
    <!-- Globe -->
    <circle cx="30" cy="36" r="21"/>
    <!-- Equator and one parallel -->
    <path d="M9.6 30h40.8" stroke="#38bdf8"/>
    <path d="M12.4 45h35.2" stroke="#38bdf8"/>
    <!-- Meridian -->
    <ellipse cx="30" cy="36" rx="9.5" ry="21" stroke="#38bdf8"/>
  </g>
  <!-- Great-circle route arc, dashed the way the app draws its route legs -->
  <path d="M14 26C22 8 44 6 55 15" fill="none" stroke="#14b8a6" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="0.1 7"/>
  <!-- Destination pin -->
  <path d="M55 6c-3.6 0-6.5 2.9-6.5 6.5C48.5 17.4 55 24 55 24s6.5-6.6 6.5-11.5C61.5 8.9 58.6 6 55 6z"
        fill="#f97316"/>
  <circle cx="55" cy="12.5" r="2.4" fill="#fff"/>
</svg>
